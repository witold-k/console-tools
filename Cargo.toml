[package]
name = "console-tools"
version = "0.1.0"
edition = "2024"

# The native binaries and wasm32-wasip1 build use only the Rust standard library.
[dependencies]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
panic = "abort"

[[bin]]
name = "xcat"
path = "src/bin/xcat.rs"

[[bin]]
name = "cptx"
path = "src/bin/cptx.rs"

[[bin]]
name = "wasm-host"
path = "src/bin/wasm_host.rs"
